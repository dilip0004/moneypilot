<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyPilot - Desktop View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-indigo-600 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold"><i class="fas fa-plane-arrival mr-2"></i>MoneyPilot Desktop</h1>
            <div id="status" class="flex items-center">
                <span class="w-3 h-3 bg-green-400 rounded-full mr-2"></span>
                <span>Connected</span>
            </div>
        </div>
    </nav>

    <main class="container mx-auto mt-8 p-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Summary Cards -->
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h3 class="text-gray-500 text-sm font-semibold uppercase tracking-wider">Total Assets</h3>
                <p id="totalAssets" class="text-3xl font-bold text-gray-800 mt-2">₹ 0.00</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-green-500">
                <h3 class="text-gray-500 text-sm font-semibold uppercase tracking-wider">Wallets</h3>
                <p id="walletCount" class="text-3xl font-bold text-gray-800 mt-2">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-indigo-500">
                <h3 class="text-gray-500 text-sm font-semibold uppercase tracking-wider">Recent Transactions</h3>
                <p id="transactionCount" class="text-3xl font-bold text-gray-800 mt-2">0</p>
            </div>
        </div>

        <div class="mt-8 grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Wallets List -->
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-xl font-bold mb-4 flex items-center">
                    <i class="fas fa-wallet text-indigo-500 mr-2"></i> Your Wallets
                </h2>
                <div id="walletsList" class="space-y-4">
                    <p class="text-gray-400 italic">Loading wallets...</p>
                </div>
            </div>

            <!-- Transactions List -->
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-xl font-bold mb-4 flex items-center">
                    <i class="fas fa-list text-indigo-500 mr-2"></i> Recent Transactions
                </h2>
                <div id="transactionsList" class="space-y-4 overflow-y-auto max-h-[500px]">
                    <p class="text-gray-400 italic">Loading transactions...</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function fetchData() {
            try {
                const walletsRes = await fetch('/api/wallets');
                const wallets = await walletsRes.json();
                renderWallets(wallets);

                const transactionsRes = await fetch('/api/transactions');
                const transactions = await transactionsRes.json();
                renderTransactions(transactions);
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('status').innerHTML = '<span class="w-3 h-3 bg-red-500 rounded-full mr-2"></span>Disconnected';
            }
        }

        function renderWallets(wallets) {
            const list = document.getElementById('walletsList');
            list.innerHTML = '';
            let total = 0;
            wallets.forEach(wallet => {
                total += wallet.currentBalance;
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center p-3 hover:bg-gray-50 rounded-lg transition';
                div.innerHTML = `
                    <div class="flex items-center">
                        <span class="text-2xl mr-3">${wallet.icon}</span>
                        <div>
                            <p class="font-bold text-gray-800">${wallet.name}</p>
                            <p class="text-xs text-gray-500">${wallet.type}</p>
                        </div>
                    </div>
                    <p class="font-mono font-bold text-indigo-600">₹ ${wallet.currentBalance.toLocaleString()}</p>
                `;
                list.appendChild(div);
            });
            document.getElementById('totalAssets').textContent = `₹ ${total.toLocaleString()}`;
            document.getElementById('walletCount').textContent = wallets.length;
        }

        function renderTransactions(transactions) {
            const list = document.getElementById('transactionsList');
            list.innerHTML = '';
            transactions.forEach(tx => {
                const date = new Date(tx.dateTime).toLocaleDateString();
                const isExpense = tx.type === 'Expense';
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center p-3 border-b border-gray-100 hover:bg-gray-50';
                div.innerHTML = `
                    <div>
                        <p class="font-semibold text-sm text-gray-800">${tx.note || 'No Note'}</p>
                        <p class="text-xs text-gray-500">${date} • ${tx.transactionSourceType}</p>
                    </div>
                    <p class="font-mono font-bold ${isExpense ? 'text-red-500' : 'text-green-500'}">
                        ${isExpense ? '-' : '+'} ₹ ${tx.amount.toLocaleString()}
                    </p>
                `;
                list.appendChild(div);
            });
            document.getElementById('transactionCount').textContent = transactions.length;
        }

        fetchData();
        setInterval(fetchData, 30000); // Auto refresh every 30 seconds
    </script>
</body>
</html>
